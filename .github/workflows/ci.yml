name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Sintaksis yoxlaması (frontend)
        run: node --check ../frontend/js/engine.js && node --check ../frontend/js/pro.js && node --check ../frontend/sw.js
      - name: Testlər (mühərrik + API)
        run: npm test
